<div class="border-b border-slate-200 bg-slate-50 dark:border-slate-800 dark:bg-slate-900">
  <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
    {{- with .Parent }}{{ if not .IsHome }}
    <a href="{{ .RelPermalink }}" class="text-sm font-semibold text-brand-700 hover:underline dark:text-brand-400">{{ .Title }}</a>
    {{- end }}{{ end }}
    <h1 class="mt-1 text-3xl font-semibold sm:text-4xl">{{ .Title }}{{ with .Params.status }} <span class="ml-2 inline-block translate-y-[-0.3em] rounded-full bg-amber-100 px-2.5 py-0.5 align-middle font-sans text-xs font-semibold tracking-wide text-amber-900 uppercase dark:bg-amber-900 dark:text-amber-100">{{ . }}</span>{{ end }}</h1>
    {{- with .Description }}<p class="mt-3 max-w-2xl text-lg text-slate-600 dark:text-slate-300">{{ . }}</p>{{ end }}
  </div>
</div>

{{- /* Dated list of pages (news, podcast episodes). Context: page collection. */ -}}
<ul class="divide-y divide-slate-200 border-y border-slate-200 dark:divide-slate-800 dark:border-slate-800">
  {{- range .ByDate.Reverse }}
  <li class="py-6">
    <p class="text-sm text-slate-500 dark:text-slate-400"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format "2 January 2006" }}</time>{{ with .Params.episode }} · Episode {{ . }}{{ end }}</p>
    <h2 class="mt-1 text-xl font-semibold"><a href="{{ .RelPermalink }}" class="hover:text-brand-700 dark:hover:text-brand-300">{{ .Title }}</a></h2>
    <p class="mt-2 max-w-3xl text-slate-600 dark:text-slate-400">{{ .Summary | plainify }}</p>
  </li>
  {{- end }}
</ul>

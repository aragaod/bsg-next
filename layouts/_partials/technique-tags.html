{{- /* Renders technique chips. Context: a list of technique ids from data/techniques.yaml. */ -}}
{{- with . }}
<ul class="flex flex-wrap gap-1.5" aria-label="Techniques">
  {{- range . }}
    {{- $id := . }}
    {{- $label := $id }}
    {{- range where hugo.Data.techniques "id" $id }}{{ $label = .label }}{{ end }}
  <li class="rounded-full bg-brand-50 px-2.5 py-0.5 text-xs font-medium text-brand-800 ring-1 ring-brand-200 ring-inset dark:bg-brand-950 dark:text-brand-200 dark:ring-brand-800">{{ $label }}</li>
  {{- end }}
</ul>
{{- end }}

<header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/85 backdrop-blur dark:border-slate-800 dark:bg-slate-950/85">
  <nav class="mx-auto flex max-w-7xl items-center justify-between gap-6 px-4 py-3 sm:px-6 lg:px-8" aria-label="Main">
    <a href="{{ site.Home.RelPermalink }}" class="flex items-center gap-2.5 text-brand-700 dark:text-brand-400">
      {{ partial "logo.html" "size-11 shrink-0" }}
      <span class="font-display text-lg leading-tight font-semibold text-slate-900 dark:text-white">
        <span class="hidden sm:inline">Biological Structures Group</span><span class="sm:hidden">BSG</span>
      </span>
    </a>
    <ul class="hidden items-center gap-1 lg:flex">
      {{- range site.Menus.main }}
      {{- $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
      <li>
        <a href="{{ .URL }}" class="rounded-md px-3 py-2 text-sm font-medium {{ if $active }}bg-brand-50 text-brand-800 dark:bg-brand-950 dark:text-brand-200{{ else }}text-slate-700 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white{{ end }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      </li>
      {{- end }}
    </ul>
    <div class="flex items-center gap-1">
    <button type="button" data-theme-toggle class="rounded-md p-2 text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800" aria-label="Switch between light and dark mode" title="Light / dark mode">
      <svg class="size-5 dark:hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="hidden size-5 dark:block" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" data-menu-toggle aria-expanded="false" aria-controls="mobile-menu" class="rounded-md p-2 text-slate-700 hover:bg-slate-100 lg:hidden dark:text-slate-300 dark:hover:bg-slate-800">
      <span class="sr-only">Open menu</span>
      <svg class="size-6" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    </div>
  </nav>
  <div id="mobile-menu" class="hidden border-t border-slate-200 lg:hidden dark:border-slate-800">
    <ul class="mx-auto max-w-7xl space-y-1 px-4 py-3 sm:px-6">
      {{- range site.Menus.main }}
      <li><a href="{{ .URL }}" class="block rounded-md px-3 py-2 text-base font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </div>
</header>

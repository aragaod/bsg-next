{{ define "main" }}
{{ partial "page-header.html" . }}
<div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
  <div class="prose-bsg">{{ .Content }}</div>
  {{- with .Pages }}
  <ul class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    {{- range . }}
    <li>
      <a href="{{ .RelPermalink }}" class="block h-full rounded-2xl border border-slate-200 p-6 hover:border-brand-300 hover:shadow-md dark:border-slate-800 dark:hover:border-brand-700">
        <h2 class="text-lg font-semibold">{{ .Title }}</h2>
        {{- with .Description }}<p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-400">{{ . }}</p>{{ end }}
      </a>
    </li>
    {{- end }}
  </ul>
  {{- end }}
</div>
{{ end }}

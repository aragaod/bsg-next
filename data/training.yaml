# Carried over from the old Education page and broadened beyond crystallography.
courses:
- title: CCP4-BCA Protein Crystallography Summer School
  provider: CCP4 and the British Crystallographic Association
  url: https://www.jic.ac.uk/event/ccp4-bca-protein-crystallography-summer-school-2026/
  format: in-person
  level: introductory
  techniques: &id002
  - crystallography
  when: 'Every September (2026: 6–11 September, John Innes Centre, Norwich)'
  location: UK
  description: For students and researchers relatively new to crystallography. Lectures cover protein expression through to structure validation, with supervised computer tutorials and a crystal manipulation
    and cryo-cooling workshop.
- title: CCP4 Study Weekend
  provider: CCP4
  url: https://studyweekend.ccp4.ac.uk/
  format: in-person
  level: all
  techniques:
  - crystallography
  - cryo-em
  when: Every January
  location: UK
  description: Annual meeting on computational methods in macromolecular structure determination, with a different theme each year.
- title: CCP-EM training
  provider: CCP-EM
  url: https://www.ccpem.ac.uk/training/
  format: hybrid
  level: all
  techniques: &id001
  - cryo-em
  when: Courses through the year
  description: Courses and workshops on cryo-EM data processing and model building from the UK's collaborative computational project for cryo-EM.

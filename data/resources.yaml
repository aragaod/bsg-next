# Resources page: links grouped into groups > sections > links.
# Each link: name, url, optional description, optional techniques (ids from
# data/techniques.yaml; links without techniques show under every filter).
# Carried over from the old "Useful links" page and broadened by technique.
# Notes: Diamond pages block automated link checks, so the eBIC and B21 URLs
# should be checked by hand. Removed as dead (Sep 2026): BMSC Washington
# tutorials and Raster3D (server unreachable).
# Also unverifiable by script (they block bots): FindAPhD, JISCMail (CCP4BB), AstraZeneca, Charles River, UCL, RSC, IoP, IUCr (bot-blocked; checked by hand).
groups:
- id: facilities
  title: Facilities
  intro: Where to collect data. Most offer peer-reviewed access for academic users.
  sections:
  - title: UK facilities
    links:
    - name: Diamond Light Source
      url: https://www.diamond.ac.uk
      description: 'The UK''s synchrotron: macromolecular crystallography, SAXS, imaging and cryo-EM.'
      techniques:
      - crystallography
      - saxs
      - imaging
      - cryo-em
    - name: Macromolecular crystallography beamlines, Diamond
      url: https://www.diamond.ac.uk/Instruments/Mx.html
      techniques:
      - crystallography
      description: 'The MX village: all of Diamond''s crystallography beamlines, including in situ (VMXi), long-wavelength and microfocus.'
    - name: XChem fragment screening, Diamond
      url: https://www.diamond.ac.uk/Instruments/Mx/Fragment-Screening.html
      techniques:
      - crystallography
      - drug-design
      description: 'Crystallographic fragment screening: soaking, harvesting, data collection and analysis of up to 1000 compounds in a week.'
    - name: Membrane Protein Laboratory (MPL), Diamond
      url: https://www.diamond.ac.uk/Instruments/Mx/MPL.html
      techniques:
      - crystallography
      - cryo-em
      - saxs
      description: 'Research and training facility for membrane protein structures at the Research Complex at Harwell: high-throughput cloning, expression and purification, sample preparation for integrative
        structural biology. Open to users worldwide; an Instruct-ERIC centre.'
    - name: B23 circular dichroism beamline, Diamond
      url: https://www.diamond.ac.uk/Instruments/Soft-Condensed-Matter/B23.html
      techniques:
      - biophysics
      description: Synchrotron CD for protein folding, secondary structure and interactions.
    - name: B24 cryo soft X-ray tomography, Diamond
      url: https://www.diamond.ac.uk/Instruments/Biological-Cryo-Imaging/B24.html
      techniques:
      - imaging
      description: 3D imaging of whole frozen cells (25–40 nm), with correlative cryo light microscopy.
    - name: eBIC, the Electron Bio-Imaging Centre at Diamond
      url: https://www.diamond.ac.uk/Instruments/Biological-Cryo-Imaging/eBIC.html
      description: National facility for cryo-EM and cryo-electron tomography.
      techniques:
      - cryo-em
      - imaging
    - name: B21 bio-SAXS beamline, Diamond
      url: https://www.diamond.ac.uk/Instruments/Soft-Condensed-Matter/small-angle/B21.html
      description: Solution scattering, including size-exclusion chromatography SAXS.
      techniques: &id005
      - saxs
    - name: ISIS Neutron and Muon Source
      url: https://www.isis.stfc.ac.uk/
      description: Neutron scattering, including small-angle neutron scattering.
      techniques:
      - saxs
      - other
    - name: Rosalind Franklin Institute
      url: https://www.rfi.ac.uk/
      description: New imaging and structural biology technologies.
      techniques:
      - imaging
      - cryo-em
    - name: Instruct-ERIC
      url: https://instruct-eric.org/
      description: European research infrastructure for structural biology, with funded access to facilities across Europe.
      techniques:
      - crystallography
      - cryo-em
      - saxs
      - imaging

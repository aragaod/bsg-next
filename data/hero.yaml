# Home page hero images. One is shown per day, following "schedule" in order
# (the nightly rebuild moves to the next day's entry). Listing an image more
# than once shows it more often.
schedule: [ptx3, pla2r, spd2, toll5a, ptx3, snar, bgal, il33, ptx3, kras, pla2r, spd2, ptx3, toll5a, snar, bgal, ptx3, il33, kras, pla2r, ptx3, spd2, toll5a, snar, ptx3, bgal, il33, kras]

images:
  - id: ptx3
    image: images/hero/ptx3.png
    inset: images/hero/ptx3-whole.png
    title: Pentraxin-3 (PTX3)
    alt: "Pentraxin-3 shown three ways: a translucent violet SAXS envelope around a teal cryo-EM surface, with a window revealing the amber crystal structure of one domain and its blue electron density."
    summary: An innate-immunity protein that helps build the extracellular matrix, seen at three scales.
    lab: Tony Day's group, University of Manchester
    layers:
      - { colour: violet, technique: Bio-SAXS, where: Diamond B21, note: "Whole protein; the arms are an AlphaFold model validated against the SAXS data" }
      - { colour: teal, technique: Cryo-EM, where: eBIC, note: "Central core, 3.3 Å" }
      - { colour: amber, technique: X-ray crystallography, where: Diamond I04-1, note: "One domain at 2.4 Å, with electron density (blue)" }
    paper: { citation: "Shah et al., Matrix Biology 136, 52–68 (2025)", doi: 10.1016/j.matbio.2025.01.002 }
    data: "SASBDB SASDVA6 · EMD-19717 · PDB 8S50 · PDB 8PVQ"
    method: "The SAXS envelope is a low-resolution map of the authors' SAXS-validated model (SASDVA6). The X-ray density is the PDBe 2Fo−Fc map. Rendered with UCSF ChimeraX."

  - id: pla2r
    image: images/hero/pla2r.png
    title: Phospholipase A2 receptor (PLA2R)
    alt: "PLA2R shown two ways: a translucent violet SAXS envelope around a teal cryo-EM surface, with a window revealing the amber atomic model of its cysteine-rich domain."
    summary: The kidney protein targeted by autoantibodies in membranous nephropathy; the window shows the domain carrying the dominant epitope.
    lab: Rachel Lennon's group, University of Manchester
    layers:
      - { colour: violet, technique: Bio-SAXS, where: Diamond B21, note: "Compact form at pH 6.2" }
      - { colour: teal, technique: Cryo-EM, where: eBIC, note: "3.4 Å" }
      - { colour: amber, technique: Atomic model, where: from the cryo-EM map, note: "Cysteine-rich domain" }
    paper: { citation: "Fresquet et al., PNAS 119, e2202209119 (2022)", doi: 10.1073/pnas.2202209119 }
    data: "SASBDB SASDNQ3 · EMD-14077 · PDB 7QSR"
    method: "The SAXS envelope was computed from the SASBDB data with DENSS (Grant, Nature Methods 2018). Rendered with UCSF ChimeraX."

  - id: spd2
    image: images/hero/spd2.png
    title: A new protein fold in the centrosome
    alt: "Two domains of the centrosome protein Spd-2 side by side in the same orientation: a green bundle of NMR models on the left and an amber crystal structure with blue electron density on the right, showing the same fold."
    summary: Two domains of the centrosome scaffold protein Spd-2, one solved by NMR and one by crystallography, share a newly described fold.
    lab: Jordan Raff's group, University of Oxford, with Susan Lea (NCI, USA, and Oxford), Mark van Breugel (MRC LMB) and Zhe Feng (Fudan University)
    layers:
      - { colour: green, technique: NMR, where: "Bruker 500/600 MHz", note: "ASH1 domain, ensemble of models" }
      - { colour: amber, technique: X-ray crystallography, where: Diamond I04-1, note: "ASH3 domain, 1.93 Å, with electron density (blue)" }
    paper: { citation: "Hu et al., Science Advances 11, eadr5744 (2025)", doi: 10.1126/sciadv.adr5744 }
    data: "PDB 9FU8 · BMRB 34925 · PDB 9C72"
    method: "The two domains were oriented the same way by structural alignment (TM-align; TM-score about 0.5, the same fold). The paper does not name the NMR facility. Rendered with UCSF ChimeraX."

  - id: toll5a
    image: images/hero/toll5a.png
    title: Toll5A receptor with Spätzle
    alt: "The mosquito Toll5A–Spätzle complex: a translucent violet SAXS envelope around a teal cryo-EM surface of two curved receptors, with a window revealing the amber Spätzle ligand."
    summary: A mosquito immune receptor pair bound to its signal protein, from the insect that carries dengue and Zika.
    lab: Monique Gangloff's group, University of Cambridge
    layers:
      - { colour: violet, technique: Bio-SAXS, where: Diamond B21, note: "The complex in solution" }
      - { colour: teal, technique: Cryo-EM, where: eBIC, note: "4.2 Å" }
      - { colour: amber, technique: Atomic model, where: from the cryo-EM map, note: "Spätzle ligand" }
    paper: { citation: "Saucereau et al., Nature Communications 13, 5110 (2022)", doi: 10.1038/s41467-022-32690-6 }
    data: "SASBDB SASDKY8 · EMD-11982 · PDB 7B1B"
    method: "The SAXS envelope was computed from the SASBDB data with DENSS (Grant, Nature Methods 2018). Rendered with UCSF ChimeraX."

  - id: snar
    image: images/hero/snar.png
    title: An enzyme evolved for pharmaceutical chemistry
    alt: "An amber designed enzyme with a pale surface, and the bound substrate in the active site shown inside blue electron density."
    summary: A designed enzyme, improved by directed evolution, that performs a key pharmaceutical reaction with precise control of the product's handedness.
    lab: Anthony Green's group, Manchester Institute of Biotechnology
    layers:
      - { colour: amber, technique: X-ray crystallography, where: Diamond I03, note: "1.7 Å, substrate in electron density (blue)" }
      - { colour: green, technique: Molecular dynamics and docking, where: "GROMACS, AutoDock Vina", note: "Showed how Arg124 holds the substrate in a reactive position" }
    paper: { citation: "Lister et al., Nature 639, 375–381 (2025)", doi: 10.1038/s41586-025-08611-0 }
    data: "PDB 9FUG · 9FUL · 9FUO"
    method: "Crystal structure with the 2Fo−Fc density (PDBe) around the bound substrate. The enzyme was improved by directed evolution and characterised by kinetics and protein mass spectrometry; docking (AutoDock Vina) and molecular dynamics (GROMACS 2018, AMBER14 force field) were performed at the Manchester Institute of Biotechnology. The simulations are described in the paper, not shown in the image. Rendered with UCSF ChimeraX."
  - id: bgal
    image: images/hero/bgal.png
    title: A protein that flew through a mass spectrometer
    alt: "Two cryo-EM maps of the enzyme beta-galactosidase side by side in the same orientation: teal, frozen from solution, and orange, after selection in a mass spectrometer and soft landing on a cold grid. They have the same overall shape."
    summary: The enzyme β-galactosidase keeps its structure after passing through a mass spectrometer, answering a long-standing question for native mass spectrometry.
    lab: Stephan Rauschenbach's and Carol Robinson's groups, University of Oxford
    layers:
      - { colour: orange, technique: Native mass spectrometry + cryo-EM, where: "Orbitrap UHMR, soft landing", note: "Mass-selected in the gas phase, then imaged, 2.6 Å" }
      - { colour: teal, technique: Cryo-EM, where: from solution, note: "Conventional sample (Bartesaghi et al., Structure 2018)" }
    paper: { citation: "Esser et al., Science Advances 10, eadl4628 (2024)", doi: 10.1126/sciadv.adl4628 }
    data: "EMD-18244 · PDB 8Q7Y · EMD-7770 · PDB 6CVM"
    method: "Both maps filtered identically (Gaussian, 2 Å) and drawn to enclose the same volume, after aligning them by map-to-map fitting (correlation 0.90). The gas-phase structure is slightly more compact, as the paper reports. Rendered with UCSF ChimeraX."
  - id: il33
    image: images/hero/il33.png
    title: IL-33 held by a parasite protein
    alt: "A parasitic worm protein (dark amber) gripping the immune alarm signal IL-33 (light amber), with blue electron density at the interface, a pink extra domain seen only by SAXS and AlphaFold, all inside a translucent violet SAXS envelope."
    summary: A protein from a parasitic worm that blocks IL-33, an alarm signal in allergy and asthma, seen by crystallography, SAXS and AlphaFold together.
    lab: Matthew Higgins's group, University of Oxford
    layers:
      - { colour: violet, technique: Bio-SAXS, where: Diamond B21, note: "The complex in solution" }
      - { colour: amber, technique: X-ray crystallography, where: Diamond I04, note: "2.1 Å, with electron density (blue)" }
      - { colour: rose, technique: AlphaFold, where: validated by SAXS, note: "Extra domain not seen in the crystal" }
    paper: { citation: "Jamwal et al., Nature Communications 15, 5226 (2024)", doi: 10.1038/s41467-024-49550-0 }
    data: "SASBDB SASDUY6 · PDB 8Q5R"
    method: "The SAXS envelope was computed from the SASBDB data with DENSS (Grant, Nature Methods 2018) and agrees with the authors' AlphaFold model deposited with SASDUY6 (correlation 0.93). The X-ray density is the PDBe 2Fo−Fc map. Rendered with UCSF ChimeraX."

  - id: kras
    image: images/hero/kras.png
    title: A degrader drug for cancer-causing KRAS
    alt: "A teal cryo-EM surface of the ubiquitin ligase machinery with a window revealing the amber crystal structure of KRAS and VHL held together by a degrader molecule, shown in blue electron density."
    summary: A small molecule that glues cancer-causing KRAS to the cell's disposal machinery, degrading 13 of the 17 most common KRAS mutants.
    lab: Alessio Ciulli's group, University of Dundee, with Boehringer Ingelheim
    layers:
      - { colour: amber, technique: X-ray crystallography, where: SLS, note: "KRAS–degrader–VHL complex, 2.2 Å, with electron density (blue)" }
      - { colour: teal, technique: Cryo-EM, where: Titan Krios, note: "Full ligase complex, 3.5 Å" }
    paper: { citation: "Popow et al., Science 385, 1338–1347 (2024)", doi: 10.1126/science.adm8684 }
    data: "PDB 8QVU · EMD-18657 · PDB 8QU8"
    method: "The crystal structure was superposed on the cryo-EM model through VHL; the cryo-EM surface is cut away around it. The X-ray density is the PDBe 2Fo−Fc map. Rendered with UCSF ChimeraX."

